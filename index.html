
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bernard AI</title>
<script type="module">
import { pipeline, env } from
'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';

env.allowLocalModels = false;
env.useBrowserCache = true;

const $ = id => document.getElementById(id);
const STORAGE = 'bernard-chats-v2';

let brain = null;
let loading = null;
let busy = false;
let chats = [];
let activeChat = null;

function newChatObject() {
  return {
    id: Date.now().toString(),
    title: 'New chat',
    messages: []
  };
}

function saveChats() {
  try {
    localStorage.setItem(STORAGE, JSON.stringify(chats));
  } catch (e) {
    setStatus('Storage is full. Older chats may not save.');
  }
}

function setStatus(s) {
  $('status').textContent = s;
}

function currentChat() {
  return chats.find(c => c.id === activeChat);
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;',
    '"':'&quot;', "'":'&#39;'
  }[c]));
}

function render() {
  const c = currentChat();
  $('messages').innerHTML = '';

  if (!c || !c.messages.length) {
    $('messages').innerHTML =
      '<div class="welcome"><h2>Hey, I’m Bernard.</h2>' +
      '<p>Ask me anything. I’ll do my best to help.</p></div>';
  } else {
    for (const m of c.messages) {
      const div = document.createElement('div');
      div.className = 'message ' + m.role;
      div.innerHTML =
        '<div class="who">' +
        (m.role === 'user' ? 'You' : 'Bernard') +
        '</div><div class="body">' +
        escapeHTML(m.content).replace(/\n/g, '<br>') +
        '</div>';
      $('messages').appendChild(div);
    }
  }

  $('history').innerHTML = '';
  [...chats].reverse().forEach(c => {
    const b = document.createElement('button');
    b.className = 'history-item' +
      (c.id === activeChat ? ' selected' : '');
    b.textContent = c.title || 'New chat';
    b.onclick = () => {
      activeChat = c.id;
      render();
    };
    $('history').appendChild(b);
  });

  $('messages').scrollTop = $('messages').scrollHeight;
}

function loadChats() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE) || '[]');
    if (Array.isArray(saved)) chats = saved;
  } catch (e) {
    chats = [];
  }

  if (!chats.length) chats = [newChatObject()];
  activeChat = chats[chats.length - 1].id;
  render();
}

function newChat() {
  const c = newChatObject();
  chats.push(c);
  activeChat = c.id;
  saveChats();
  render();
}

async function loadBrain() {
  if (brain) return brain;
  if (loading) return loading;

  loading = (async () => {
    setStatus('Downloading AI model. Keep this page open…');

    brain = await pipeline(
      'text-generation',
      'onnx-community/SmolLM2-360M-Instruct-ONNX',
      { dtype: 'q4' }
    );

    setStatus('Bernard is ready.');
    return brain;
  })();

  try {
    return await loading;
  } catch (e) {
    loading = null;
    brain = null;
    setStatus('Model failed to load. Try again or use web answers.');
    throw e;
  }
}

async function wikipediaSearch(q) {
  const url = 'https://en.wikipedia.org/w/api.php?' +
    new URLSearchParams({
      action: 'query',
      generator: 'search',
      gsrsearch: q,
      gsrlimit: '3',
      prop: 'extracts',
      exintro: '1',
      explaintext: '1',
      exsentences: '5',
      format: 'json',
      origin: '*'
    });

  const r = await fetch(url);
  if (!r.ok) throw new Error('Wikipedia request failed');

  const data = await r.json();
  const pages = Object.values(data.query?.pages || {});
  return pages.map(p => ({
    title: p.title,
    text: p.extract || ''
  })).filter(p => p.text);
}

async function webAnswer(q) {
  try {
    const pages = await wikipediaSearch(q);
    if (pages.length) {
      return 'Here’s what I found online:\n\n' +
        pages.map(p => p.title + '\n' + p.text).join('\n\n') +
        '\n\nSource: https://en.wikipedia.org/';
    }
  } catch (e) {}

  return 'I couldn’t retrieve a useful web result just now. ' +
    'I can still try to answer from my local AI model. ' +
    'For current information, check a search engine directly.';
}

function wantsWeb(q) {
  return /\b(search the web|search online|look online|look it up|find online|latest news|current news|today's news|right now|current price|recent updates)\b/i.test(q);
}

function wantsJoke(q) {
  return /\b(tell me a joke|make me laugh|another joke|joke please|say something funny)\b/i.test(q);
}

async function generateAnswer(q, history) {
  const model = await loadBrain();

  const recent = history.slice(-6).map(m => ({
    role: m.role === 'assistant' ? 'assistant' : m.role,
    content: m.content.slice(0, 1200)
  }));

  const messages = [
    {
      role: 'system',
      content:
        'You are Bernard, a friendly, capable and straightforward AI assistant. ' +
        'Be natural, warm, curious and occasionally funny, but do not force jokes. ' +
        'Answer the actual question. Explain things clearly at the right level. ' +
        'For maths, calculate carefully and show working when useful. ' +
        'For summaries, summarise the supplied information rather than defining the word summary. ' +
        'Never claim to have searched the internet unless web results were actually supplied. ' +
        'If you do not know something, admit it. Do not repeat the same sentence. ' +
        'Keep answers focused and useful.'
    },
    ...recent,
    { role: 'user', content: q }
  ];

  const result = await model(messages, {
    max_new_tokens: 220,
    do_sample: false,
    repetition_penalty: 1.12
  });

  const output = result?.[0]?.generated_text;
  let answer = '';

  if (typeof output === 'string') {
    answer = output;
  } else if (Array.isArray(output)) {
    answer = output.filter(m => m.role === 'assistant')
      .map(m => m.content).join('\n');
  }

  answer = answer.trim();

  if (!answer) throw new Error('The model returned an empty answer.');

  if (answer.startsWith(q)) answer = answer.slice(q.length).trim();
  if (answer.startsWith('Bernard:')) {
    answer = answer.slice(8).trim();
  }

  return answer || 'I couldn’t form an answer. Please try asking another way.';
}

async function send() {
  if (busy) return;

  const q = $('prompt').value.trim();
  if (!q) return;

  busy = true;
  $('send').disabled = true;
  $('prompt').value = '';

  let c = currentChat();
  if (!c) {
    newChat();
    c = currentChat();
  }

  if (!c.messages.length) c.title = q.slice(0, 36);

  c.messages.push({ role: 'user', content: q });
  saveChats();
  render();

  const thinking = document.createElement('div');
  thinking.className = 'message assistant';
  thinking.innerHTML = '<div class="who">Bernard</div>' +
    '<div class="body">Thinking…</div>';
  $('messages').appendChild(thinking);
  $('messages').scrollTop = $('messages').scrollHeight;

  try {
    let answer;

    if (wantsJoke(q)) {
      answer = await generateAnswer(
        'Tell me one genuinely funny, original joke. Do not explain it.', []
      );
    } else if (wantsWeb(q)) {
      setStatus('Searching Wikipedia…');
      answer = await webAnswer(q);
    } else {
      setStatus('Thinking…');
      answer = await generateAnswer(
        q, c.messages.slice(0, -1)
      );
    }

    c.messages.push({ role: 'assistant', content: answer });
    setStatus('Bernard is ready.');
  } catch (e) {
    c.messages.push({
      role: 'assistant',
      content:
        'I hit a problem while answering. The model may still be downloading, ' +
        'or your browser may not have enough memory. Please try again.'
    });
    setStatus('Something went wrong. Your saved chats have been kept.');
    console.error(e);
  } finally {
    saveChats();
    render();
    busy = false;
    $('send').disabled = false;
    $('prompt').focus();
  }
}

window.addEventListener('DOMContentLoaded', () => {
  loadChats();
  $('send').onclick = send;
  $('newchat').onclick = newChat;
  $('prompt').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
});
</script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111318;color:#eee;font-family:-apple-system,BlinkMacSystemFont,sans-serif;height:100dvh}
.app{display:flex;height:100dvh;max-width:1200px;margin:auto}
.sidebar{width:235px;background:#191b22;padding:16px;display:flex;flex-direction:column;gap:12px;border-right:1px solid #30323a}
.brand{font-size:23px;font-weight:750;padding:5px 0 12px}
button{cursor:pointer;border:1px solid #3b3e48;border-radius:10px;background:#242731;color:#eee;padding:11px;font-size:14px}
button:hover{background:#303440}
#newchat{background:#4f46e5;border-color:#4f46e5}
#history{display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.history-item{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.history-item.selected{border-color:#7775ff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{padding:13px 18px;border-bottom:1px solid #292c34;font-size:13px;color:#aeb1be}
#status{color:#aaa}
#messages{flex:1;overflow-y:auto;padding:22px max(16px,calc((100% - 760px)/2))}
.welcome{text-align:center;margin:17vh auto 0;max-width:450px}
.welcome h2{font-size:29px}
.welcome p{color:#a9adbb}
.message{max-width:760px;margin:0 auto 24px;line-height:1.6;overflow-wrap:anywhere}
.who{font-size:12px;font-weight:700;color:#a5a9ff;margin-bottom:7px}
.message.user .who{color:#d5d7df}
.body{font-size:15px}
.composer{padding:12px 16px 18px;width:100%;max-width:800px;margin:0 auto}
.inputrow{display:flex;gap:9px;background:#20232b;border:1px solid #414450;border-radius:14px;padding:8px}
textarea{flex:1;min-width:0;resize:vertical;min-height:44px;max-height:160px;background:transparent;color:#fff;border:0;outline:0;padding:10px;font:inherit}
#send{background:#5b54ed;border:0;min-width:65px}
#send:disabled{opacity:.5}
.note{text-align:center;color:#858998;font-size:11px;padding-top:8px}
@media(max-width:600px){.sidebar{width:115px;padding:10px}.brand{font-size:19px}.history-item{font-size:11px;padding:8px}.top{padding:12px;font-size:12px}#messages{padding:16px 12px}.composer{padding:10px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Bernard</div>
    <button id="newchat">+ New chat</button>
    <div id="history"></div>
  </aside>
  <main class="main">
    <div class="top">Bernard AI · <span id="status">Starting…</span></div>
    <div id="messages"></div>
    <div class="composer">
      <div class="inputrow">
        <textarea id="prompt" rows="1" placeholder="Ask Bernard anything…"></textarea>
        <button id="send">Send</button>
      </div>
      <div class="note">Local AI · Free web lookup when requested · Shift + Enter for a new line</div>
    </div>
  </main>
</div>
</body>
</html>
