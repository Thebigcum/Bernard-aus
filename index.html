
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101522">
<title>Bernard AI</title>
<style>
:root {
  color-scheme: dark;
  --bg: #101522;
  --panel: #191f30;
  --panel2: #222a3e;
  --text: #f3f5ff;
  --muted: #a5afc6;
  --accent: #8b7cff;
  --border: #303951;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  min-height: 100dvh;
}
.app {
  max-width: 850px;
  height: 100dvh;
  margin: auto;
  display: flex;
  flex-direction: column;
  padding: 16px;
  padding-top: max(16px, env(safe-area-inset-top));
  padding-bottom: max(12px, env(safe-area-inset-bottom));
}
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 0 16px;
  border-bottom: 1px solid var(--border);
}
.logo {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #8b7cff, #42d8ce);
  border-radius: 15px;
  color: #101522;
  font-size: 25px;
  font-weight: 900;
}
.heading { flex: 1; min-width: 0; }
h1 { font-size: 21px; margin: 0 0 4px; }
#status { font-size: 12px; color: var(--muted); }
button, input { font: inherit; }
button {
  border: 0;
  border-radius: 12px;
  padding: 11px 14px;
  cursor: pointer;
}
button:disabled { opacity: .55; cursor: wait; }
#new {
  color: var(--text);
  background: var(--panel2);
  border: 1px solid var(--border);
  font-size: 13px;
}
#messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 18px 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overscroll-behavior: contain;
}
.msg {
  max-width: 88%;
  padding: 13px 15px;
  border-radius: 17px;
  line-height: 1.55;
  font-size: 15px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.user {
  align-self: flex-end;
  background: var(--accent);
  color: white;
  border-bottom-right-radius: 5px;
}
.bernard {
  align-self: flex-start;
  background: var(--panel);
  border: 1px solid var(--border);
  border-bottom-left-radius: 5px;
}
.welcome {
  margin: auto 0;
  text-align: center;
  color: var(--muted);
  line-height: 1.7;
}
.welcome strong { color: var(--text); font-size: 20px; }
form {
  display: flex;
  gap: 9px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
#input {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  border-radius: 15px;
  padding: 14px;
  outline: none;
  font-size: 16px;
}
#input:focus { border-color: var(--accent); }
#send {
  background: var(--accent);
  color: white;
  font-weight: 700;
  min-width: 72px;
}
.note {
  color: var(--muted);
  text-align: center;
  font-size: 11px;
  padding-top: 9px;
}
@media (max-width: 450px) {
  .app { padding-left: 12px; padding-right: 12px; }
  .msg { max-width: 94%; }
  #new { padding: 10px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">B</div>
    <div class="heading">
      <h1>Bernard AI</h1>
      <div id="status">Ready to start</div>
    </div>
    <button id="new" type="button">＋ New chat</button>
  </header>

  <main id="messages" aria-live="polite"></main>

  <form id="bottom">
    <input id="input" type="text" placeholder="Message Bernard..." autocomplete="off" required>
    <button id="send" type="submit">Send</button>
  </form>
  <div class="note">Private browser AI · Your chats are saved in this browser</div>
</div>

<script type="module">
import { pipeline } from
  'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';

const area = document.getElementById('messages');
const input = document.getElementById('input');
const send = document.getElementById('send');
const status = document.getElementById('status');
const newButton = document.getElementById('new');

const STORAGE_KEY = 'bernard-chats-v2';
const MODEL = 'onnx-community/Qwen2.5-0.5B-Instruct-ONNX-MHA';

let chats = [];
let current = 0;
let brain = null;
let busy = false;

try {
  chats = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
} catch (e) {
  chats = [];
}

if (!Array.isArray(chats) || !chats.length) chats = [[]];

chats = chats.map(chat =>
  Array.isArray(chat)
    ? chat.filter(m =>
        m && typeof m.text === 'string' &&
        (m.who === 'you' || m.who === 'bernard')
      )
    : []
);

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
  } catch (e) {
    status.textContent = 'Could not save chat storage';
  }
}

function draw() {
  area.replaceChildren();

  if (!chats[current].length) {
    const welcome = document.createElement('div');
    welcome.className = 'welcome';
    const title = document.createElement('strong');
    title.textContent = 'Hey, I’m Bernard.';
    const description = document.createElement('p');
    description.textContent =
      'Ask me a question, get help with an idea, or just have a chat.';
    welcome.append(title, description);
    area.appendChild(welcome);
    return;
  }

  for (const m of chats[current]) {
    const div = document.createElement('div');
    div.className = 'msg ' +
      (m.who === 'you' ? 'user' : 'bernard');
    div.textContent = m.text;
    area.appendChild(div);
  }

  area.scrollTop = area.scrollHeight;
}

function add(who, text) {
  chats[current].push({ who, text });
  save();
  draw();
}

async function loadBrain() {
  if (brain) return brain;

  status.textContent =
    'Downloading Bernard’s larger AI model. Keep this page open…';

  brain = await pipeline(
    'text-generation',
    MODEL,
    { dtype: 'q4' }
  );

  status.textContent = 'AI loaded · Bernard is ready';
  return brain;
}

async function answer(question) {
  const model = await loadBrain();

  // Include recent conversation context, excluding the current question.
  const previous = chats[current]
    .slice(0, -1)
    .slice(-8)
    .map(m => ({
      role: m.who === 'you' ? 'user' : 'assistant',
      content: m.text
    }));

  const messages = [
    {
      role: 'system',
      content:
        'You are Bernard, a friendly, intelligent and honest personal AI assistant. ' +
        'Answer the user’s actual question directly. Do not simply repeat, paraphrase, ' +
        'or mirror the user’s message. Do not change the user’s I into you or your ' +
        'into my. Respond naturally as a conversation partner. Use simple, clear ' +
        'language. For questions, give the answer first. If you do not know something, ' +
        'say so honestly. Keep casual replies brief, but explain properly when asked. ' +
        'Never claim you performed an action you did not perform.'
    },
    ...previous,
    { role: 'user', content: question }
  ];

  status.textContent = 'Bernard is thinking…';

  const result = await model(messages, {
    max_new_tokens: 128,
    do_sample: false,
    repetition_penalty: 1.12
  });

  const output = result?.[0]?.generated_text;
  let response = '';

  if (Array.isArray(output)) {
    const last = output[output.length - 1];
    response = typeof last === 'string'
      ? last
      : (last?.content || '');
  } else if (typeof output === 'string') {
    response = output;
  }

  response = response.trim();

  // Avoid displaying a complete echoed copy of the user's question.
  if (!response || response === question.trim()) {
    return 'I’m having trouble forming an answer. Could you ask that another way?';
  }

  return response;
}

document.getElementById('bottom').addEventListener('submit', async e => {
  e.preventDefault();

  const question = input.value.trim();
  if (!question || busy) return;

  add('you', question);
  input.value = '';
  busy = true;
  send.disabled = true;
  input.disabled = true;
  newButton.disabled = true;

  try {
    const response = await answer(question);
    add('bernard', response);
    status.textContent = 'AI ready · Runs in your browser';
  } catch (e) {
    console.error(e);
    brain = null;

    add(
      'bernard',
      'I couldn’t load or run the AI model. Check your internet connection and try again. ' +
      'The first download is large, so your iPhone may need time and free memory. ' +
      'Your saved chats have not been intentionally deleted.'
    );

    status.textContent = 'AI failed to load · Try again';
  } finally {
    busy = false;
    send.disabled = false;
    input.disabled = false;
    newButton.disabled = false;
    input.focus();
  }
});

newButton.addEventListener('click', () => {
  if (busy) return;
  chats.push([]);
  current = chats.length - 1;
  save();
  draw();
  input.focus();
});

draw();
</script>
</body>
</html>
