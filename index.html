
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bernard AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111318;color:#eee;font-family:-apple-system,BlinkMacSystemFont,sans-serif;height:100dvh}
.app{display:flex;height:100dvh;max-width:1200px;margin:auto}
.sidebar{width:235px;background:#191b22;padding:16px;display:flex;flex-direction:column;gap:12px;border-right:1px solid #30323a}
.brand{font-size:23px;font-weight:750;padding:5px 0 12px}
button{cursor:pointer;border:1px solid #3b3e48;border-radius:10px;background:#242731;color:#eee;padding:11px;font-size:14px}
button:hover{background:#303440}
#newchat{background:#4f46e5;border-color:#4f46e5}
#history{display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.history-item{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.history-item.selected{border-color:#7775ff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{padding:13px 18px;border-bottom:1px solid #292c34;font-size:13px;color:#aeb1be}
#status{color:#aaa}
#messages{flex:1;overflow-y:auto;padding:22px max(16px,calc((100% - 760px)/2))}
.welcome{text-align:center;margin:17vh auto 0;max-width:450px}
.welcome h2{font-size:29px}
.welcome p{color:#a9adbb}
.message{max-width:760px;margin:0 auto 24px;line-height:1.6;overflow-wrap:anywhere}
.who{font-size:12px;font-weight:700;color:#a5a9ff;margin-bottom:7px}
.message.user .who{color:#d5d7df}
.body{font-size:15px}
.composer{padding:12px 16px 18px;width:100%;max-width:800px;margin:0 auto}
.inputrow{display:flex;gap:9px;background:#20232b;border:1px solid #414450;border-radius:14px;padding:8px}
textarea{flex:1;min-width:0;resize:vertical;min-height:44px;max-height:120px;background:transparent;color:#fff;border:0;outline:0;padding:10px;font:inherit}
#send{background:#5b54ed;border:0;min-width:65px}
#send:disabled{opacity:.5}
.note{text-align:center;color:#858998;font-size:11px;padding-top:8px}
@media(max-width:600px){.sidebar{width:115px;padding:10px}.brand{font-size:19px}.history-item{font-size:11px;padding:8px}.top{padding:12px;font-size:12px}#messages{padding:16px 12px}.composer{padding:10px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand">Bernard</div>
<button id="newchat">+ New chat</button>
<div id="history"></div>
</aside>
<main class="main">
<div class="top">Bernard AI · <span id="status">Ready</span></div>
<div id="messages"></div>
<div class="composer">
<div class="inputrow">
<textarea id="prompt" rows="1" placeholder="Ask Bernard anything…"></textarea>
<button id="send">Send</button>
</div>
<div class="note">Free local AI · Web lookup when requested</div>
</div>
</main>
</div>

<script type="module">
import { pipeline, env } from
'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';

env.allowLocalModels = false;
env.useBrowserCache = true;

const $ = id => document.getElementById(id);
const STORAGE = 'bernard-chats-v2';

let chats = [];
let activeChat = null;
let brain = null;
let loading = null;
let busy = false;

function status(s){$('status').textContent=s}

function newChatObject(){
 return {id:Date.now().toString()+Math.random().toString(36).slice(2),title:'New chat',messages:[]};
}

function save(){
 try{localStorage.setItem(STORAGE,JSON.stringify(chats))}
 catch(e){status('Chat storage is full')}
}

function current(){return chats.find(c=>c.id===activeChat)}

function safe(s){
 return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
 const c=current();
 $('messages').innerHTML='';
 if(!c||!c.messages.length){
  $('messages').innerHTML='<div class="welcome"><h2>Hey, I’m Bernard.</h2><p>Ask me anything. I’ll do my best to help.</p></div>';
 }else{
  for(const m of c.messages){
   const d=document.createElement('div');
   d.className='message '+m.role;
   d.innerHTML='<div class="who">'+(m.role==='user'?'You':'Bernard')+'</div><div class="body">'+safe(m.content).replace(/\n/g,'<br>')+'</div>';
   $('messages').appendChild(d);
  }
 }
 $('history').innerHTML='';
 [...chats].reverse().forEach(c=>{
  const b=document.createElement('button');
  b.className='history-item'+(c.id===activeChat?' selected':'');
  b.textContent=c.title||'New chat';
  b.onclick=()=>{activeChat=c.id;render()};
  $('history').appendChild(b);
 });
 $('messages').scrollTop=$('messages').scrollHeight;
}

function restore(){
 try{
  const data=JSON.parse(localStorage.getItem(STORAGE)||'[]');
  if(Array.isArray(data))chats=data.filter(c=>c&&c.id&&Array.isArray(c.messages));
 }catch(e){chats=[]}
 if(!chats.length)chats=[newChatObject()];
 activeChat=chats[chats.length-1].id;
 render();
}

function newChat(){
 const c=newChatObject();
 chats.push(c);
 activeChat=c.id;
 save();
 render();
 $('prompt').focus();
}

/* Lazy loading: no model download on page startup. */
async function getBrain(){
 if(brain)return brain;
 if(loading)return loading;
 loading=(async()=>{
  status('Loading small AI model…');
  brain=await pipeline(
   'text-generation',
   'onnx-community/SmolLM2-135M-Instruct-ONNX-MHA',
   {dtype:'q8'}
  );
  status('Ready');
  return brain;
 })();
 try{return await loading}
 catch(e){loading=null;brain=null;throw e}
}

/* Short requests and recent context reduce generation memory use. */
async function askModel(question,history){
 const model=await getBrain();
 const recent=history.slice(-4).map(m=>({
  role:m.role==='assistant'?'assistant':'user',
  content:String(m.content).slice(0,500)
 }));
 const messages=[
  {role:'system',content:
   'You are Bernard, a friendly, useful AI assistant. Answer the exact question. '+
   'Do not force jokes. For maths, work carefully. For summaries, summarise the text provided. '+
   'If uncertain, say so. Be clear and concise.'},
  ...recent,
  {role:'user',content:question.slice(0,1200)}
 ];
 const result=await model(messages,{
  max_new_tokens:120,
  do_sample:false,
  repetition_penalty:1.15
 });
 const out=result?.[0]?.generated_text;
 let answer='';
 if(typeof out==='string'){
  answer=out;
  const marker='[/INST]';
  if(answer.includes(marker))answer=answer.slice(answer.lastIndexOf(marker)+marker.length);
  const marker2='assistant\n';
  if(answer.includes(marker2))answer=answer.slice(answer.lastIndexOf(marker2)+marker2.length);
 }else if(Array.isArray(out)){
  answer=out.filter(m=>m.role==='assistant').map(m=>m.content).join('\n');
 }
 answer=answer.trim();
 if(!answer)throw Error('Empty model answer');
 return answer.slice(-3000);
}

async function webAnswer(q){
 try{
  const url='https://en.wikipedia.org/w/api.php?'+new URLSearchParams({
   action:'query',generator:'search',gsrsearch:q,gsrlimit:'3',
   prop:'extracts',exintro:'1',explaintext:'1',exsentences:'4',
   format:'json',origin:'*'
  });
  const r=await fetch(url);
  if(!r.ok)throw Error('Search failed');
  const data=await r.json();
  const pages=Object.values(data.query?.pages||{});
  if(!pages.length)return null;
  return 'Here is what I found online:\n\n'+pages.map(p=>p.title+'\n'+p.extract).join('\n\n')+'\n\nSource: Wikipedia';
 }catch(e){return null}
}

function needsWeb(q){
 return /\b(search the web|search online|look online|look it up|find online|latest news|current news|today's news|current price|recent updates)\b/i.test(q);
}

function isJoke(q){
 return /\b(tell me a joke|make me laugh|another joke|joke please)\b/i.test(q);
}

async function send(){
 if(busy)return;
 const q=$('prompt').value.trim();
 if(!q)return;
 busy=true;
 $('send').disabled=true;
 $('prompt').value='';
 let c=current();
 if(!c){c=newChatObject();chats.push(c);activeChat=c.id}
 if(!c.messages.length)c.title=q.slice(0,36);
 c.messages.push({role:'user',content:q});
 save();
 render();

 const thinking=document.createElement('div');
 thinking.className='message assistant';
 thinking.innerHTML='<div class="who">Bernard</div><div class="body">Thinking…</div>';
 $('messages').appendChild(thinking);
 $('messages').scrollTop=$('messages').scrollHeight;

 try{
  let answer;
  if(needsWeb(q)){
   status('Searching…');
   answer=await webAnswer(q);
   if(!answer)answer='The web search failed this time. I’ll try answering from my local model.';
   if(!answer.startsWith('The web search failed')) {
    c.messages.push({role:'assistant',content:answer});
    save();render();return;
   }
  }
  status('Thinking…');
  const question=isJoke(q)
   ?'Tell me one short, funny joke. Do not repeat the question.'
   :q;
  answer=await askModel(question,c.messages.slice(0,-1));
  c.messages.push({role:'assistant',content:answer});
 }catch(e){
  console.error(e);
  c.messages.push({role:'assistant',content:
   'Sorry mate, my AI model failed to load or ran out of memory. Your chat has been saved. Try reloading once, then ask a shorter question.'});
  status('AI model error');
 }finally{
  save();render();
  busy=false;
  $('send').disabled=false;
  $('prompt').focus();
  if($('status').textContent!=='AI model error')status('Ready');
 }
}

$('newchat').onclick=newChat;
$('send').onclick=send;
$('prompt').addEventListener('keydown',e=>{
 if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}
});
restore();
</script>
</body>
</html>
