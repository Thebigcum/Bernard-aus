
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101522">
<title>Bernard AI</title>
<style>
:root{color-scheme:dark;--bg:#101522;--panel:#191f30;--panel2:#222a3e;--text:#f3f5ff;--muted:#a5afc6;--accent:#8b7cff;--border:#303951}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:850px;height:100dvh;margin:auto;display:flex;flex-direction:column;padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(10px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;padding:8px 0 14px;border-bottom:1px solid var(--border)}
.logo{width:44px;height:44px;display:grid;place-items:center;background:linear-gradient(135deg,#8b7cff,#42d8ce);border-radius:14px;color:#101522;font-size:25px;font-weight:900}
.heading{flex:1;min-width:0}h1{font-size:21px;margin:0 0 4px}#status{font-size:12px;color:var(--muted)}
button,input{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;cursor:pointer}button:disabled{opacity:.55}
#new{color:var(--text);background:var(--panel2);border:1px solid var(--border);font-size:13px}
#messages{flex:1;min-height:0;overflow-y:auto;padding:18px 0;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:13px 15px;border-radius:17px;line-height:1.5;font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
.user{align-self:flex-end;background:var(--accent);color:white;border-bottom-right-radius:5px}
.bernard{align-self:flex-start;background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:5px}
.welcome{margin:auto 0;text-align:center;color:var(--muted);line-height:1.7}.welcome strong{color:var(--text);font-size:20px}
form{display:flex;gap:9px;padding-top:12px;border-top:1px solid var(--border)}
#input{flex:1;min-width:0;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:15px;padding:14px;font-size:16px}
#send{background:var(--accent);color:white;font-weight:700}
.note{color:var(--muted);text-align:center;font-size:11px;padding-top:9px}
@media(max-width:450px){.app{padding-left:12px;padding-right:12px}.msg{max-width:96%}#new{padding:10px}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo">B</div>
<div class="heading"><h1>Bernard AI</h1><div id="status">Ready to start</div></div>
<button id="new" type="button">＋ New chat</button>
</header>
<main id="messages" aria-live="polite"></main>
<form id="bottom">
<input id="input" type="text" placeholder="Message Bernard..." autocomplete="off" required>
<button id="send" type="submit">Send</button>
</form>
<div class="note">Private browser AI · Chats saved in this browser</div>
</div>
<script type="module">
import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';

const $=id=>document.getElementById(id);
const area=$('messages'),input=$('input'),send=$('send');
const status=$('status'),newButton=$('new');
const STORAGE_KEY='bernard-chats-v2';
const MODEL='onnx-community/SmolLM2-135M-Instruct-ONNX-MHA';

let chats=[],current=0,brain=null,busy=false;

try{chats=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){}
if(!Array.isArray(chats)||!chats.length)chats=[[]];
chats=chats.map(c=>Array.isArray(c)?c.filter(m=>m&&typeof m.text==='string'&&(m.who==='you'||m.who==='bernard')):[]);

function save(){
try{localStorage.setItem(STORAGE_KEY,JSON.stringify(chats))}
catch(e){status.textContent='Chat storage is full'}
}
function draw(){
area.replaceChildren();
if(!chats[current].length){
const w=document.createElement('div');w.className='welcome';
const t=document.createElement('strong');t.textContent='Hey, I’m Bernard.';
const p=document.createElement('p');p.textContent='Ask me a question, get help with an idea, or just have a chat.';
w.append(t,p);area.append(w);return;
}
for(const m of chats[current]){
const d=document.createElement('div');
d.className='msg '+(m.who==='you'?'user':'bernard');
d.textContent=m.text;area.append(d);
}
area.scrollTop=area.scrollHeight;
}
function add(who,text){chats[current].push({who,text});save();draw()}

async function loadBrain(){
if(brain)return brain;
status.textContent='Preparing Bernard…';
try{
const loaded=await pipeline('text-generation',MODEL,{
dtype:'q8',
progress_callback:p=>{
if(p.status==='progress'&&typeof p.progress==='number'){
status.textContent='Downloading AI model: '+Math.round(p.progress)+'%';
}else if(p.status==='downloading'){
status.textContent='Downloading AI model…';
}else if(p.status==='ready'){
status.textContent='Preparing AI model…';
}
}
});
brain=loaded;
status.textContent='Bernard is ready';
return brain;
}catch(error){
brain=null;
status.textContent='Model failed to load · Try again';
throw error;
}
}

function repeated(text){
const sentences=text.split(/(?<=[.!?])\s+/)
.map(s=>s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim())
.filter(s=>s.length>12);
return new Set(sentences).size<sentences.length;
}
function clean(text){
const seen=new Set();
return text.split(/(?<=[.!?])\s+/).filter(s=>{
const k=s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim();
if(!k||seen.has(k))return false;
seen.add(k);return true;
}).join(' ').trim();
}
function extract(result){
const g=result?.[0]?.generated_text;
if(Array.isArray(g)){
const last=g[g.length-1];
return (typeof last==='string'?last:last?.content||'').trim();
}
return typeof g==='string'?g.trim():'';
}

async function answer(question){
const model=await loadBrain();
const history=chats[current].slice(0,-1).slice(-4).map(m=>({
role:m.who==='you'?'user':'assistant',
content:m.text.slice(0,350)
}));
const system='You are Bernard, a friendly and helpful AI assistant. Answer the latest user question directly. Do not repeat the question. Do not repeat sentences or give the same answer twice. Keep simple answers short. Explain properly when asked. Be honest when unsure.';
const messages=[
{role:'system',content:system},
...history,
{role:'user',content:question}
];
status.textContent='Bernard is thinking…';
let result=await model(messages,{
max_new_tokens:64,
do_sample:false,
repetition_penalty:1.2,
no_repeat_ngram_size:4
});
let response=extract(result);
if(!response||repeated(response)){
status.textContent='Trying a fresh answer…';
result=await model([
{role:'system',content:system+' Give one short answer. No repetition.'},
{role:'user',content:question}
],{
max_new_tokens:48,
do_sample:false,
repetition_penalty:1.25,
no_repeat_ngram_size:4
});
response=extract(result);
}
response=clean(response);
if(!response||response.toLowerCase()===question.toLowerCase()){
return 'I’m struggling to answer clearly. Try asking me another way.';
}
if(repeated(response)){
return 'I got stuck repeating myself. Please try asking in a new chat.';
}
return response;
}

$('bottom').addEventListener('submit',async e=>{
e.preventDefault();
const question=input.value.trim();
if(!question||busy)return;
add('you',question);
input.value='';
busy=true;send.disabled=true;input.disabled=true;newButton.disabled=true;
try{
const response=await answer(question);
add('bernard',response);
status.textContent='AI ready · Runs in your browser';
}catch(error){
console.error(error);
brain=null;
add('bernard','I couldn’t load or run the AI model. Check your internet connection and try again. Your saved chats have not been intentionally deleted.');
status.textContent='AI error · Try again';
}finally{
busy=false;send.disabled=false;input.disabled=false;newButton.disabled=false;input.focus();
}
});

newButton.addEventListener('click',()=>{
if(busy)return;
chats.push([]);current=chats.length-1;save();draw();input.focus();
});
draw();
</script>
</body>
</html>
