
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101522">
<title>Bernard AI</title>
<style>
:root{color-scheme:dark;--bg:#101522;--panel:#191f30;--panel2:#222a3e;--text:#f3f5ff;--muted:#a5afc6;--accent:#8b7cff;--border:#303951}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:850px;height:100dvh;margin:auto;display:flex;flex-direction:column;padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(10px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;padding:8px 0 14px;border-bottom:1px solid var(--border)}
.logo{width:44px;height:44px;display:grid;place-items:center;background:linear-gradient(135deg,#8b7cff,#42d8ce);border-radius:14px;color:#101522;font-size:25px;font-weight:900}
.heading{flex:1;min-width:0}h1{font-size:21px;margin:0 0 4px}#status{font-size:12px;color:var(--muted)}
button,input{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;cursor:pointer}button:disabled{opacity:.55}
#new{color:var(--text);background:var(--panel2);border:1px solid var(--border);font-size:13px}
#messages{flex:1;min-height:0;overflow-y:auto;padding:18px 0;display:flex;flex-direction:column;gap:12px}
.msg{max-width:96%;padding:13px 15px;border-radius:17px;line-height:1.5;font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
.user{align-self:flex-end;background:var(--accent);color:white;border-bottom-right-radius:5px}
.bernard{align-self:flex-start;background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:5px}
.welcome{margin:auto 0;text-align:center;color:var(--muted);line-height:1.7}.welcome strong{color:var(--text);font-size:20px}
form{display:flex;gap:9px;padding-top:12px;border-top:1px solid var(--border)}
#input{flex:1;min-width:0;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:15px;padding:14px;font-size:16px}
#send{background:var(--accent);color:white;font-weight:700}
.note{color:var(--muted);text-align:center;font-size:11px;padding-top:9px}
a{color:#a99fff;overflow-wrap:anywhere}
@media(max-width:450px){.app{padding-left:12px;padding-right:12px}.msg{max-width:98%}#new{padding:10px}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo">B</div>
<div class="heading"><h1>Bernard AI</h1><div id="status">Ready · Free web search</div></div>
<button id="new" type="button">＋ New chat</button>
</header>
<main id="messages" aria-live="polite"></main>
<form id="bottom">
<input id="input" type="text" placeholder="Message Bernard..." autocomplete="off" required>
<button id="send" type="submit">Send</button>
</form>
<div class="note">Free browser AI + web search · Chats saved on this device</div>
</div>
<script type="module">
import{pipeline}from'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';
const $=id=>document.getElementById(id),area=$('messages'),input=$('input'),send=$('send'),status=$('status'),newButton=$('new');
const KEY='bernard-chats-v2',MODEL='onnx-community/SmolLM2-135M-Instruct-ONNX-MHA';
let chats=[],current=0,brain=null,busy=false;
try{chats=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
if(!Array.isArray(chats)||!chats.length)chats=[[]];
chats=chats.map(c=>Array.isArray(c)?c.filter(m=>m&&typeof m.text==='string'&&(m.who==='you'||m.who==='bernard')):[]);
function save(){try{localStorage.setItem(KEY,JSON.stringify(chats))}catch(e){status.textContent='Chat storage is full'}}
function draw(){
area.replaceChildren();
if(!chats[current].length){const w=document.createElement('div');w.className='welcome';const b=document.createElement('strong');b.textContent='Hey, I’m Bernard.';const p=document.createElement('p');p.textContent='Ask me anything. I can search the internet and summarise information.';w.append(b,p);area.append(w);return}
for(const m of chats[current]){const d=document.createElement('div');d.className='msg '+(m.who==='you'?'user':'bernard');d.textContent=m.text;area.append(d)}
area.scrollTop=area.scrollHeight;
}
function add(who,text){chats[current].push({who,text});save();draw()}
function clean(s){return(s||'').replace(/<[^>]*>/g,'').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim()}
function addAnswer(text){
add('bernard',text);
const d=area.lastElementChild;if(!d)return;
const lines=text.split('\n');d.replaceChildren();
for(let i=0;i<lines.length;i++){
const match=lines[i].match(/^(.*?)(https?:\/\/\S+)$/);
if(match){d.append(document.createTextNode(match[1]));const a=document.createElement('a');a.href=match[2];a.textContent=match[2];a.target='_blank';a.rel='noopener noreferrer';d.append(a)}
else d.append(document.createTextNode(lines[i]));
if(i<lines.length-1)d.append(document.createElement('br'));
}
}
async function searchWeb(q){
status.textContent='Searching the internet…';
const url='https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(q)+'&format=json&origin=*&srlimit=3';
const r=await fetch(url);if(!r.ok)throw Error('Search unavailable');
const data=await r.json(),items=data.query?.search||[];
return Promise.all(items.map(async x=>{
let summary='';
try{const p=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(x.title.replace(/ /g,'_')));if(p.ok){const j=await p.json();summary=j.extract||''}}catch(e){}
return{title:x.title,summary:summary||clean(x.snippet),url:'https://en.wikipedia.org/wiki/'+encodeURIComponent(x.title.replace(/ /g,'_'))};
})).then(a=>a.filter(x=>x.summary));
}
async function loadBrain(){
if(brain)return brain;
status.textContent='Loading AI model…';
brain=await pipeline('text-generation',MODEL,{dtype:'q8',progress_callback:p=>{if(p.status==='progress'&&typeof p.progress==='number')status.textContent='Downloading AI: '+Math.round(p.progress)+'%';else if(p.status==='downloading')status.textContent='Downloading AI model…'}});
return brain;
}
function isSummary(q){return/\b(summar(?:y|ise|ize|ising|izing)|sum up|in short|briefly|key points|main points)\b/i.test(q)}
function isJoke(q){return/\b(joke|make me laugh|something funny)\b/i.test(q)}
function getJoke(){const a=['Why did the scarecrow win an award? Because he was outstanding in his field.','What do you call cheese that isn’t yours? Nacho cheese.','Why did the bicycle fall over? It was two-tired.','I told my computer I needed a break. It went to sleep.','Why did the maths book look sad? It had too many problems.'];return a[Math.floor(Math.random()*a.length)]}
function shorten(text,max=3){
const sentences=text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[text];
return sentences.slice(0,max).join(' ').trim().slice(0,650);
}
async function answer(q){
if(isJoke(q))return getJoke();
const greeting=/^(hi|hello|hey|yo|thanks|thank you|good morning|good night)[!. ]*$/i.test(q);
if(!greeting){
try{
const results=await searchWeb(q);
if(results.length){
const chosen=isSummary(q)?results.slice(0,2):results.slice(0,2);
let out=isSummary(q)?'Here is a short summary:\n\n'+chosen.map(x=>x.title+': '+shorten(x.summary,3)).join('\n\n'):'Here is what I found:\n\n'+chosen.map(x=>x.title+': '+shorten(x.summary,4)).join('\n\n');
out+='\n\nSources:\n'+chosen.map(x=>x.url).join('\n');
return out;
}
}catch(e){console.warn('Web search unavailable',e)}
}
status.textContent='Loading AI only when needed…';
const model=await loadBrain();
const history=chats[current].slice(0,-1).slice(-4).map(m=>({role:m.who==='you'?'user':'assistant',content:m.text.slice(0,220)}));
const out=await model([{role:'system',content:'You are Bernard, a friendly helpful assistant. Answer directly and simply. Do not repeat yourself. Be honest if unsure.'},...history,{role:'user',content:q}],{max_new_tokens:64,do_sample:false,repetition_penalty:1.2,no_repeat_ngram_size:4});
const g=out?.[0]?.generated_text;
let s=Array.isArray(g)?(g[g.length-1]?.content||''):g;
return typeof s==='string'&&s.trim()?s.trim():'I could not make a clear answer. Please try asking another way.';
}
$('bottom').addEventListener('submit',async e=>{
e.preventDefault();const q=input.value.trim();if(!q||busy)return;
add('you',q);input.value='';busy=true;send.disabled=input.disabled=newButton.disabled=true;
try{addAnswer(await answer(q));status.textContent='Ready · Web search available'}
catch(e){console.error(e);brain=null;add('bernard','I could not complete that request. Check your connection and try again. Your saved chats have not been intentionally deleted.');status.textContent='Error · Try again'}
finally{busy=false;send.disabled=input.disabled=newButton.disabled=false;input.focus()}
});
newButton.addEventListener('click',()=>{if(busy)return;chats.push([]);current=chats.length-1;save();draw();input.focus()});
draw();
</script>
</body>
</html>
