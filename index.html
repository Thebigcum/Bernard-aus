<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131c">
<title>Bernard AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131c;color:#f4f5fa;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{padding:16px 13px;background:#191e2b;border-bottom:1px solid #30364a;display:flex;align-items:center;gap:11px}
.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#7c5cff,#28c9b8);display:grid;place-items:center;font-size:25px}
h1{font-size:20px;margin:0 0 4px}
small{color:#a8b0c5}
button{cursor:pointer}
#new{margin-left:auto;background:#30364a;color:white;border:0;border-radius:12px;padding:11px}
#status{padding:10px 13px;background:#151a26;color:#c3cbe0;font-size:12px}
#messages{height:calc(100dvh - 178px);overflow-y:auto;padding:16px 12px 25px;display:flex;flex-direction:column;gap:13px}
.msg{max-width:90%;padding:13px 15px;border-radius:18px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.bernard{align-self:flex-start;background:#222a3b;border-bottom-left-radius:5px}
.user{align-self:flex-end;background:#6650df;border-bottom-right-radius:5px}
#bottom{position:fixed;bottom:0;left:0;right:0;background:#191e2b;padding:11px 10px;padding-bottom:max(11px,env(safe-area-inset-bottom));display:flex;gap:8px}
input{min-width:0;flex:1;background:#252c3d;color:white;border:1px solid #414a60;border-radius:15px;padding:13px;font-size:16px;outline:none}
#send{background:#7c5cff;color:white;border:0;border-radius:15px;padding:0 16px;font-weight:bold}
button:disabled{opacity:.5}
</style>
</head>
<body>
<header>
<div class="logo">✦</div>
<div><h1>Bernard</h1><small>Your personal assistant</small></div>
<button id="new">＋ New</button>
</header>
<div id="status">Ready. AI loads when you send your first message.</div>
<main id="messages"></main>
<form id="bottom">
<input id="input" placeholder="Message Bernard..." autocomplete="off">
<button id="send" type="submit">Send</button>
</form>

<script type="module">
import { pipeline } from
'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';

const area = document.getElementById('messages');
const input = document.getElementById('input');
const send = document.getElementById('send');
const status = document.getElementById('status');

let chats = [];
let current = 0;
let brain = null;
let busy = false;

try {
  chats = JSON.parse(localStorage.getItem('bernard-chats-v2') || '[]');
} catch(e) {}
if (!Array.isArray(chats) || !chats.length) chats = [[]];

function save() {
  try {
    localStorage.setItem('bernard-chats-v2', JSON.stringify(chats));
  } catch(e) {}
}

function draw() {
  area.replaceChildren();
  for (const m of chats[current]) {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.who === 'you' ? 'user' : 'bernard');
    div.textContent = m.text;
    area.appendChild(div);
  }
  area.scrollTop = area.scrollHeight;
}

function add(who, text) {
  chats[current].push({who, text});
  save();
  draw();
}

async function loadBrain() {
  if (brain) return brain;

  status.textContent = 'Loading small AI model. Please keep this page open...';

  brain = await pipeline(
    'text-generation',
    'onnx-community/SmolLM2-135M-Instruct-ONNX-MHA',
    {dtype: 'q8'}
  );

  status.textContent = 'AI loaded. Bernard is ready!';
  return brain;
}

async function answer(question) {
  const model = await loadBrain();

  const history = chats[current]
    .slice(-7, -1)
    .map(m => ({
      role: m.who === 'you' ? 'user' : 'assistant',
      content: m.text
    }));

  const messages = [
    {
      role: 'system',
      content: 'You are Bernard, a friendly, honest and helpful personal assistant. Answer the question directly in simple, accurate language. Admit uncertainty when necessary.'
    },
    ...history,
    {role: 'user', content: question}
  ];

  status.textContent = 'Bernard is thinking...';

  const result = await model(messages, {
    max_new_tokens: 80,
    do_sample: false
  });

  const output = result[0].generated_text;
  let response = '';

  if (Array.isArray(output)) {
    const last = output[output.length - 1];
    response = typeof last === 'string' ? last : last.content || '';
  } else if (typeof output === 'string') {
    response = output;
  }

  return response.trim() || 'I could not generate an answer. Please try again.';
}

document.getElementById('bottom').addEventListener('submit', async e => {
  e.preventDefault();

  const question = input.value.trim();
  if (!question || busy) return;

  add('you', question);
  input.value = '';
  busy = true;
  send.disabled = true;
  input.disabled = true;

  try {
    const response = await answer(question);
    add('bernard', response);
    status.textContent = 'AI ready · Runs in your browser';
  } catch (e) {
    console.error(e);
    brain = null;
    add('bernard',
      'The AI could not load. Check your connection and try again. If the page keeps resetting, this editor or iPhone may not have enough memory.');
    status.textContent = 'AI failed to load. You can try again.';
  } finally {
    busy = false;
    send.disabled = false;
    input.disabled = false;
  }
});

document.getElementById('new').addEventListener('click', () => {
  if (busy) return;
  chats.push([]);
  current = chats.length - 1;
  save();
  draw();
});

if (!chats[current].length) {
  chats[current].push({
    who: 'bernard',
    text: 'Hey! I am Bernard. Send me a message to start my AI brain.'
  });
  save();
}
draw();
</script>
</body>
</html>
