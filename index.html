
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101522">
<title>Bernard AI</title>
<style>
:root{color-scheme:dark;--bg:#101522;--panel:#191f30;--panel2:#222a3e;--text:#f3f5ff;--muted:#a5afc6;--accent:#8b7cff;--border:#303951}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:850px;height:100dvh;margin:auto;display:flex;flex-direction:column;padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(10px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;padding:8px 0 14px;border-bottom:1px solid var(--border)}
.logo{width:44px;height:44px;display:grid;place-items:center;background:linear-gradient(135deg,#8b7cff,#42d8ce);border-radius:14px;color:#101522;font-size:25px;font-weight:900}
.heading{flex:1;min-width:0}h1{font-size:21px;margin:0 0 4px}#status{font-size:12px;color:var(--muted)}
button,input{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;cursor:pointer}button:disabled{opacity:.55}
#new{color:var(--text);background:var(--panel2);border:1px solid var(--border);font-size:13px}
#messages{flex:1;min-height:0;overflow-y:auto;padding:18px 0;display:flex;flex-direction:column;gap:12px}
.msg{max-width:96%;padding:13px 15px;border-radius:17px;line-height:1.5;font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
.user{align-self:flex-end;background:var(--accent);color:white;border-bottom-right-radius:5px}
.bernard{align-self:flex-start;background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:5px}
.welcome{margin:auto 0;text-align:center;color:var(--muted);line-height:1.7}.welcome strong{color:var(--text);font-size:20px}
form{display:flex;gap:9px;padding-top:12px;border-top:1px solid var(--border)}
#input{flex:1;min-width:0;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:15px;padding:14px;font-size:16px}
#send{background:var(--accent);color:white;font-weight:700}
.note{color:var(--muted);text-align:center;font-size:11px;padding-top:9px}
a{color:#a99fff;overflow-wrap:anywhere}
@media(max-width:450px){.app{padding-left:12px;padding-right:12px}.msg{max-width:98%}#new{padding:10px}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo">B</div>
<div class="heading"><h1>Bernard AI</h1><div id="status">Free internet search enabled</div></div>
<button id="new" type="button">＋ New chat</button>
</header>
<main id="messages" aria-live="polite"></main>
<form id="bottom">
<input id="input" type="text" placeholder="Message Bernard..." autocomplete="off" required>
<button id="send" type="submit">Send</button>
</form>
<div class="note">Browser AI + Wikipedia search · Chats saved on this device</div>
</div>
<script type="module">
import{pipeline}from'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';
const $=id=>document.getElementById(id),area=$('messages'),input=$('input'),send=$('send'),status=$('status'),newButton=$('new');
const KEY='bernard-chats-v2',MODEL='onnx-community/SmolLM2-135M-Instruct-ONNX-MHA';
let chats=[],current=0,brain=null,busy=false;
try{chats=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
if(!Array.isArray(chats)||!chats.length)chats=[[]];
chats=chats.map(c=>Array.isArray(c)?c.filter(m=>m&&typeof m.text==='string'&&(m.who==='you'||m.who==='bernard')):[]);
function save(){try{localStorage.setItem(KEY,JSON.stringify(chats))}catch(e){status.textContent='Storage full'}}
function draw(){
area.replaceChildren();
if(!chats[current].length){const w=document.createElement('div');w.className='welcome';const b=document.createElement('strong');b.textContent='Hey, I’m Bernard.';const p=document.createElement('p');p.textContent='Ask me anything. I can search the internet for information.';w.append(b,p);area.append(w);return}
for(const m of chats[current]){const d=document.createElement('div');d.className='msg '+(m.who==='you'?'user':'bernard');d.textContent=m.text;area.append(d)}
area.scrollTop=area.scrollHeight;
}
function add(who,text){chats[current].push({who,text});save();draw()}
function linkify(text){
const box=document.createElement('div');box.className='msg bernard';
const lines=text.split('\n');
for(let i=0;i<lines.length;i++){
const line=lines[i],match=line.match(/^(.*?)(https?:\/\/\S+)$/);
if(match){box.append(document.createTextNode(match[1]));const a=document.createElement('a');a.href=match[2];a.textContent=match[2];a.target='_blank';a.rel='noopener noreferrer';box.append(a)}
else box.append(document.createTextNode(line));
if(i<lines.length-1)box.append(document.createElement('br'));
}
area.append(box);area.scrollTop=area.scrollHeight;
}
function addAnswer(text){chats[current].push({who:'bernard',text});save();draw();const last=area.lastElementChild;if(last){const lines=text.split('\n');last.replaceChildren();for(let i=0;i<lines.length;i++){const m=lines[i].match(/^(.*?)(https?:\/\/\S+)$/);if(m){last.append(document.createTextNode(m[1]));const a=document.createElement('a');a.href=m[2];a.textContent=m[2];a.target='_blank';a.rel='noopener noreferrer';last.append(a)}else last.append(document.createTextNode(lines[i]));if(i<lines.length-1)last.append(document.createElement('br'))}}}
function plain(s){const d=document.createElement('div');d.innerHTML=s;return(d.textContent||'').trim()}
async function searchWeb(q){
status.textContent='Searching Wikipedia…';
const url='https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(q)+'&format=json&origin=*&srlimit=4';
const r=await fetch(url);if(!r.ok)throw Error('Search unavailable');
const data=await r.json(),items=data.query?.search||[];
const results=await Promise.all(items.slice(0,3).map(async x=>{
let summary='';
try{const p=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(x.title.replace(/ /g,'_')));if(p.ok){const j=await p.json();summary=j.extract||''}}catch(e){}
return{title:x.title,summary:summary||plain(x.snippet),url:'https://en.wikipedia.org/wiki/'+encodeURIComponent(x.title.replace(/ /g,'_'))};
}));
return results.filter(x=>x.summary);
}
async function loadBrain(){
if(brain)return brain;
status.textContent='Loading AI model…';
brain=await pipeline('text-generation',MODEL,{dtype:'q8',progress_callback:p=>{if(p.status==='progress'&&typeof p.progress==='number')status.textContent='Downloading AI: '+Math.round(p.progress)+'%';else if(p.status==='downloading')status.textContent='Downloading AI model…'}});
return brain;
}
async function answer(q){
const joke=/\b(joke|make me laugh|something funny)\b/i.test(q);
if(joke){
const jokes=[
'Why did the scarecrow win an award? Because he was outstanding in his field.',
'What do you call cheese that isn’t yours? Nacho cheese.',
'I told my computer I needed a break. It said, “No problem”—then went to sleep.',
'Why did the bicycle fall over? It was two-tired.',
'Why did the maths book look sad? It had too many problems.'
];
return jokes[Math.floor(Math.random()*jokes.length)];
}
const greeting=/^(hi|hello|hey|yo|how are you|thanks|thank you)[!. ]*$/i.test(q);
if(!greeting){
try{
const results=await searchWeb(q);
if(results.length){
status.textContent='Search complete · Showing source results';
return 'Here is what I found online for: '+q+'\n\n'+results.map((x,i)=>(i+1)+'. '+x.title+'\n'+x.summary+'\nSource: '+x.url).join('\n\n')+'\n\nThese are search results, not a guarantee that every detail is current or correct.';
}
}catch(e){console.error('Search error:',e)}
}
status.textContent='Bernard is thinking…';
const model=await loadBrain();
const history=chats[current].slice(0,-1).slice(-4).map(m=>({role:m.who==='you'?'user':'assistant',content:m.text.slice(0,250)}));
const out=await model([{role:'system',content:'You are Bernard, a friendly helpful assistant. Answer directly in simple language. Do not repeat yourself. Be honest when unsure.'},...history,{role:'user',content:q}],{max_new_tokens:64,do_sample:false,repetition_penalty:1.2,no_repeat_ngram_size:4});
const g=out?.[0]?.generated_text;
let s=Array.isArray(g)?(g[g.length-1]?.content||''):g;
if(typeof s!=='string'||!s.trim())return'I couldn’t make a clear answer. Try asking another way.';
return s.trim();
}
$('bottom').addEventListener('submit',async e=>{
e.preventDefault();const q=input.value.trim();if(!q||busy)return;
add('you',q);input.value='';busy=true;send.disabled=input.disabled=newButton.disabled=true;
try{addAnswer(await answer(q));status.textContent='Ready · Internet search available'}
catch(e){console.error(e);brain=null;add('bernard','I couldn’t complete that request. Check your connection and try again. Your saved chats have not been intentionally deleted.');status.textContent='Error · Try again'}
finally{busy=false;send.disabled=input.disabled=newButton.disabled=false;input.focus()}
});
newButton.addEventListener('click',()=>{if(busy)return;chats.push([]);current=chats.length-1;save();draw();input.focus()});
draw();
</script>
</body>
</html>
